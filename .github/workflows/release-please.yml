name: Release Please

on:
  push:
    branches: [main]
  # Re-publish the version on main when a release's publish failed; a job rerun would replay the old workflow.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Pushes and PRs made with GITHUB_TOKEN trigger no workflows, so the release
      # PR never got its required checks. A token from the release bot GitHub App
      # acts as the App, and its pushes trigger CI like anyone else's.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public --loglevel verbose

      - name: Upload dist to GitHub Release
        run: gh release upload "${TAG_NAME:-longterm-memory-mcp-v$(node -p 'require("./package.json").version')}" ./dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Authenticate via OIDC
        run: ./mcp-publisher login github-oidc

      # npm accepts a publish before it serves the version, and the registry rejects a version npm does not serve yet.
      - name: Wait until npm serves the version
        run: |
          version=$(node -p 'require("./server.json").version')
          for attempt in $(seq 1 40); do
            if [ "$(npm view "longterm-memory-mcp@$version" version 2>/dev/null)" = "$version" ]; then exit 0; fi
            echo "npm does not serve $version yet, attempt $attempt/40"
            sleep 15
          done
          echo "::error::npm still does not serve longterm-memory-mcp@$version after 10 minutes"
          exit 1

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
